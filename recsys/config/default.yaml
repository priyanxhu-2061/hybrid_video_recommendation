seed: 42

data:
  # MovieLens 20M (Kaggle mirror - singular filenames, includes tag genome).
  raw_dir: data/raw/ml-20m
  processed_dir: data/processed

  # Cap users during development. The full 138k users take hours in the pure
  # numpy ALS; every decision you need to make is visible at 5-20k.
  # Set to null for a full run once the pipeline is correct.
  sample_users: 5000

  min_interactions_per_user: 5
  min_interactions_per_item: 3

  split:
    # leave_last_n: per-user holdout of their most recent events. Standard for
    # MovieLens, because a global date cut leaves too few active users at the
    # end of a 19-year timeline.
    # temporal: global date cut. Stricter - no user's test data predates any
    # other user's training data - but far fewer evaluable users. Worth running
    # once for comparison; the gap between the two is a result in itself.
    strategy: leave_last_n
    n_valid: 5
    n_test: 5
    min_train: 5
    valid_days: 180        # used only when strategy is temporal
    test_days: 180

features:
  # TF-IDF over title + genres + community tags. sentence-transformers would be
  # better but pulls in torch; not worth it until the pipeline works.
  vectorizer: tfidf
  max_features: 20000
  ngram_range: [1, 2]
  # MovieLens 20M ships the tag genome: a dense 1128-dim relevance vector per
  # film, no training needed. Usually beats TF-IDF here. Set false to compare.
  use_genome: true
  interaction_half_life_days: 365   # ratings span years, not weeks

models:
  content:
    top_n: 200
  collaborative:
    algorithm: als
    # 64 rather than 128: the pure-numpy ALS solves an f x f system per user
    # per iteration, so cost grows with the cube of this number.
    factors: 64
    regularization: 0.05
    iterations: 15
    alpha: 40                 # confidence weight for implicit feedback
  item_knn:
    k: 50
    shrink: 100
  popularity:
    half_life_hours: 8760     # 1 year - MovieLens has no "trending this week"

hybrid:
  strategy: rank_fusion
  weights:
    content: 1.0
    collaborative: 1.3
    item_knn: 1.0
    trending: 0.4

ranking:
  # MovieLens has no impressions - no record of what was shown and ignored - so
  # an honest LambdaMART reranker cannot be trained on it. Leave this off until
  # phase 4, and say so in your limitations section.
  enabled: false
  objective: lambdarank
  num_leaves: 63
  learning_rate: 0.05
  n_estimators: 400
  early_stopping_rounds: 40

diversity:
  enabled: true
  method: mmr
  lambda: 0.5
  max_per_creator: 2
  max_per_category: 4

evaluation:
  k_values: [5, 10, 20]
  # Ground truth = items the user genuinely liked, not merely rated.
  min_completion_for_relevance: 0.7   # ~3.5 stars on the 0.5-5.0 scale
  max_eval_users: 1000                # subsample for speed; null for all

artifacts:
  dir: artifacts
  version: latest